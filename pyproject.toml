[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fde-shipment-risk-takehome"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "scikit-learn==1.8.0",
    "numpy==2.4.4",
    "scipy==1.17.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
